name: Selective remote cache

# Builds the app twice against the Develocity remote cache and shows what the filter did:
# dex merging never touches the remote, everything else uses it as normal.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: selective-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build with the remote cache filtered
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Add this repository secret to let the build reach Develocity:
      #   gh secret set DEVELOCITY_ACCESS_KEY -R ${{ github.repository }}
      # The Develocity plugin wants `host=key`; a bare key is normalised below.
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      # Without credentials there is no remote cache to filter, so the run would prove nothing.
      # Stop with an explanation rather than a confusing cache-miss build.
      - name: Check the Develocity access key
        run: |
          [ -n "$DEVELOCITY_ACCESS_KEY" ] || {
            echo "::error::secret DEVELOCITY_ACCESS_KEY is not set"
            echo "Add it with: gh secret set DEVELOCITY_ACCESS_KEY -R ${{ github.repository }}"
            exit 1
          }

          SERVER=$(grep -o 'server = "[^"]*"' settings.gradle.kts | sed -E 's/.*"(.*)"/\1/')
          HOST=$(printf '%s' "$SERVER" | sed -E 's#^https?://##; s#/.*##')
          case "$DEVELOCITY_ACCESS_KEY" in
            *=*) echo "Access key already carries a host prefix" ;;
            *)
              echo "::add-mask::$HOST=$DEVELOCITY_ACCESS_KEY"
              echo "DEVELOCITY_ACCESS_KEY=$HOST=$DEVELOCITY_ACCESS_KEY" >> "$GITHUB_ENV"
              echo "Bare access key given; prefixed it with $HOST"
              ;;
          esac

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'



      - name: Build the demo debug app
        run: ./gradlew :app:assembleDemoDebug --build-cache --stacktrace | tee build.log

